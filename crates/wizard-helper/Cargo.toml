[package]
name = "wizard-helper"
description = "AtlasOS Wizard's root D-Bus helper: creates the first account and finishes setup"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "wizard_helper"

[[bin]]
name = "atlas-wizard-helper"
path = "src/main.rs"

[[test]]
name = "bus"
path = "../../tests/helper/bus.rs"

[features]
default = []
# Test builds only (the crate lists itself under dev-dependencies, so
# `cargo test` turns this on and a release build never does): the root of every
# path, the setup user's name and the idle time come from ATLAS_WIZARD_TEST_*
# environment variables. Without it no such variable is ever read.
test-root = []

[dependencies]
telamon-framework-core.workspace = true
telamon-framework-system = { workspace = true, features = ["polkit"] }
libc.workspace = true
log.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
wizard-core.workspace = true
zbus.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
wizard-helper = { path = ".", features = ["test-root"] }
