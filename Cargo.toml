[workspace]
resolver = "3"
members = ["crates/wizard-core", "crates/wizard-boot", "crates/wizard-helper", "apps/telamon-wizard"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/EternalCoder454/atlasos-wizard"
rust-version = "1.89"

[workspace.dependencies]
# The atlas-framework crates (startup, settings, logging, crash reports,
# polkit); to move the pin, see CLAUDE.md. Telamon.Ui is not pinned here: it is
# the installed telamon-ui package.
telamon-framework-ui = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v2.0.0" }
telamon-framework-core = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v2.0.0" }
telamon-framework-system = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v2.0.0" }
libc = "0.2"
log = { version = "0.4", features = ["std"] }
# process: safe killpg for the helper's children
rustix = { version = "1", default-features = false, features = ["std", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "process", "io-util"] }
wizard-core = { path = "crates/wizard-core" }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zeroize = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
# Root code: an arithmetic overflow is a panic, never a silent wrap (docs/SECURITY.md,
# "Build hardening").
overflow-checks = true
