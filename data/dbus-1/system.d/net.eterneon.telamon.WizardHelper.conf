<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the helper's name, and only root and the setup user
       may send to it; the default stays deny,
       so no other account can make the helper do any work, not even to be
       refused. The helper still asks polkit and checks the caller's uid. -->
  <policy user="telamon-setup">
    <allow send_destination="net.eterneon.telamon.WizardHelper"
           send_interface="net.eterneon.telamon.WizardHelper1"/>
    <allow send_destination="net.eterneon.telamon.WizardHelper"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="net.eterneon.telamon.WizardHelper"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="net.eterneon.telamon.WizardHelper"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
  <policy user="root">
    <allow own="net.eterneon.telamon.WizardHelper"/>
    <allow send_destination="net.eterneon.telamon.WizardHelper"/>
  </policy>
</busconfig>
