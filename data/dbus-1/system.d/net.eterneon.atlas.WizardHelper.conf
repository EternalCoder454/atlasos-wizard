<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the helper's name. -->
  <policy user="root">
    <allow own="net.eterneon.atlas.WizardHelper"/>
  </policy>

  <!-- Anyone may call it; the helper asks polkit and checks that the caller is
       the setup user, so a call from anyone else is refused there. -->
  <policy context="default">
    <allow send_destination="net.eterneon.atlas.WizardHelper"
           send_interface="net.eterneon.atlas.WizardHelper1"/>
    <allow send_destination="net.eterneon.atlas.WizardHelper"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="net.eterneon.atlas.WizardHelper"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="net.eterneon.atlas.WizardHelper"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
