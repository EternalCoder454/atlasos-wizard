# The setup user's home, on tmpfs: nothing it writes survives a reboot.
d /run/telamon-setup 0750 telamon-setup telamon-setup -
# The state file (telamon-wizard-boot, the helper) and the done marker's directory.
d /var/lib/telamon-wizard 0755 root root -
d /etc/telamon 0755 root root -
# Atlas Wizard's marker directory, where the done marker is still written for
# the image's health check, and Atlas Installer's answers are read.
d /etc/atlasos 0755 root root -

# plasma-setup also seeds, with `f` lines, kscreenlockerrc (Autolock=false,
# LockOnResume=false, Timeout=0) and kwalletrc (Enabled=false), because it runs
# a full Plasma session. This session is KWin alone: no screen locker, no
# idle-lock daemon and no wallet run, so there is nothing to switch off and
# nothing is seeded. The wizard writes its own kdeglobals and kxkbrc at run
# time. (Seeding nothing also keeps /run/telamon-setup empty on a finished
# machine, so the boot's cleanup has nothing to remove.)
