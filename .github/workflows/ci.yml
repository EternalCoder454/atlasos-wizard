name: CI

# Job graph:
#   image  (dev-image.yml: the build image, published from main only)
#     -> lint  (fmt, qmllint, Telamon rules, shellcheck, desktop files)
#          -> clippy | test | rpm     (in parallel)
# Everything runs in ghcr.io/eternalcoder454/telamon-wizard-dev, which holds the
# build dependencies and telamon-ui, so no job installs or builds them.

on:
  push:
    branches: [main, beta]
    paths:
      - apps/**
      - crates/**
      - data/**
      - tests/**
      - scripts/**
      - packaging/**
      - ci/**
      - .containerignore
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - rust-toolchain.toml
      - .github/workflows/ci.yml
      - .github/workflows/dev-image.yml
  pull_request:
    paths:
      - apps/**
      - crates/**
      - data/**
      - tests/**
      - scripts/**
      - packaging/**
      - ci/**
      - .containerignore
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - rust-toolchain.toml
      - .github/workflows/ci.yml
      - .github/workflows/dev-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  # mold in CI only; a local build keeps the default linker.
  RUSTFLAGS: -C link-arg=-fuse-ld=mold
  # ccache compiles through the wrappers in /usr/lib64/ccache (put on PATH
  # below). The base dir and no-hash-dir make a hit independent of the
  # directory the build runs in (build-rpm.sh uses a random one under /tmp).
  CCACHE_DIR: /tmp/ccache
  CCACHE_BASEDIR: /tmp
  CCACHE_NOHASHDIR: "1"
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: 500M
  # The helper's bus tests skip without dbus-daemon and python-dbusmock; here
  # a missing tool must fail the run.
  TELAMON_WIZARD_REQUIRE_BUS_TESTS: "1"

jobs:
  # main: publishes the image when GHCR's is missing or out of date (the first
  # run ever, or a changed Containerfile, spec BuildRequires or framework tag);
  # a few seconds when it is current. Other refs only pull it; if their change
  # touches what the image holds, it is built (not pushed) to prove it builds.
  image:
    name: Dev image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/dev-image.yml

  lint:
    name: Lint
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eternalcoder454/telamon-wizard-dev:44
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Format
        run: cargo fmt --all --check

      - name: QML lint
        run: qmllint-qt6 apps/telamon-wizard/qml/*.qml

      # atlas-framework's design rules (no default buttons, no QML file named
      # like a Telamon.Ui type), from the framework tag baked into the image.
      - name: Telamon design rules
        run: |
          "$TELAMON_FRAMEWORK/tools/lint-app.sh" .
          "$TELAMON_FRAMEWORK/tools/check-app-names.sh" .

      - name: Shell scripts
        run: shellcheck scripts/*.sh ci/*.sh packaging/*.sh data/libexec/*

      # The script the package build runs on the finished programs
      # (docs/SECURITY.md, "Build hardening") against programs built with and
      # without the hardening it looks for.
      - name: Hardening check
        run: scripts/test-check-hardening.sh

      # Session files carry DesktopNames, which display managers read but
      # desktop-file-validate rejects as a non-X- key: they get a key check.
      - name: Desktop files
        run: |
          find . -name '*.desktop' -not -path './target/*' -not -path '*/wayland-sessions/*' -print0 |
            xargs -0 -r desktop-file-validate
          for f in data/wayland-sessions/*.desktop; do
            for key in Type=Application Name= Exec=/ DesktopNames=; do
              grep -q "^$key" "$f" || { echo "::error file=$f::missing $key"; exit 1; }
            done
          done

  clippy:
    name: Clippy
    needs: [image, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eternalcoder454/telamon-wizard-dev:44
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo /usr/lib64/ccache >> "$GITHUB_PATH"
      # Main saves the caches, pull requests only read them.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ccache
        with:
          path: /tmp/ccache
          key: ccache-clippy-${{ github.sha }}
          restore-keys: ccache-clippy-
      # --locked: also fails when Cargo.lock and the atlas-framework tag disagree.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: ccache --show-stats
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true'
        with:
          path: /tmp/ccache
          key: ccache-clippy-${{ github.sha }}

  test:
    name: Tests
    needs: [image, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eternalcoder454/telamon-wizard-dev:44
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo /usr/lib64/ccache >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ccache
        with:
          path: /tmp/ccache
          key: ccache-test-${{ github.sha }}
          restore-keys: ccache-test-
      # The whole workspace: the unit tests, the helper's bus tests (private
      # dbus-daemon, python-dbusmock) and the boot tests (real binary, temp roots).
      - name: Tests
        run: cargo test --workspace --locked
      # The validators and parsers (user names, hostnames, locales, the state
      # and installer.ini files, ...) with 20000 random cases each, not the
      # 256 of a local run. The property tests are the ones named props.
      - name: Property tests
        env:
          PROPTEST_CASES: "20000"
        run: cargo test --workspace --locked -- props
      # The polkit rule that lets the setup user change the system's settings
      # only while setup is not done, against a stub polkit.
      - name: Polkit rule
        run: node --test tests/helper/polkit-rules.test.mjs
      # The real useradd, chpasswd, userdel and chage against wizard-core, in a
      # throw-away root below /tmp (shadow-utils' -P); it refuses to run outside
      # a container, and this job is in one.
      - name: Real shadow-utils
        run: tests/container/real-tools.sh
      - run: ccache --show-stats
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true'
        with:
          path: /tmp/ccache
          key: ccache-test-${{ github.sha }}

  rpm:
    name: RPM
    needs: [image, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eternalcoder454/telamon-wizard-dev:44
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo /usr/lib64/ccache >> "$GITHUB_PATH"
      # rpmbuild builds in a fresh directory, so no target dir can be reused:
      # this keeps the downloaded crates (CARGO_HOME) only.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rpm
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ccache
        with:
          path: /tmp/ccache
          key: ccache-rpm-${{ github.sha }}
          restore-keys: ccache-rpm-
      - name: Build the RPM
        run: packaging/build-rpm.sh "$GITHUB_WORKSPACE/out"
      - run: ccache --show-stats
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true'
        with:
          path: /tmp/ccache
          key: ccache-rpm-${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telamon-wizard-rpm
          path: out/*.rpm
          if-no-files-found: error
          retention-days: 14
